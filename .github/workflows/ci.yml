name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/NeonBoard.Api/

      - name: Build
        run: dotnet build src/NeonBoard.Api/ --no-restore

      - name: Test
        run: dotnet test tests/NeonBoard.UnitTests/ --verbosity normal

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/NeonBoard.UI

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/NeonBoard.UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
