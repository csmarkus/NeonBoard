name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/NeonBoard.Api/

      - name: Build
        run: dotnet build src/NeonBoard.Api/ --no-restore

      - name: Test
        run: dotnet test tests/NeonBoard.UnitTests/ --verbosity normal

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/NeonBoard.UI

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/NeonBoard.UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build payload
        id: payload
        run: |
          if [[ "${{ needs.backend.result }}" == "success" && "${{ needs.frontend.result }}" == "success" ]]; then
            COLOR=3066993
          else
            COLOR=15158332
          fi

          if [[ "${{ needs.backend.result }}" == "success" ]]; then
            BACKEND="✅ Backend Build & Test"
          else
            BACKEND="❌ Backend Build & Test"
          fi

          if [[ "${{ needs.frontend.result }}" == "success" ]]; then
            FRONTEND="✅ Frontend Build & Test"
          else
            FRONTEND="❌ Frontend Build & Test"
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(jq -n \
            --arg title "${{ github.event.repository.name }}" \
            --arg commit_line "### [$COMMIT_MSG]($RUN_URL)" \
            --arg color "$COLOR" \
            --arg commit "${{ github.sha }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg author "${{ github.actor }}" \
            --arg backend "$BACKEND" \
            --arg frontend "$FRONTEND" \
            '{
              embeds: [{
                title: $title,
                description: ($commit_line + "\n\n" + $backend + "\n" + $frontend),
                color: $color,
                fields: [
                  { name: "Commit", value: ("`" + $commit + "`"), inline: true },
                  { name: "Branch", value: ("`" + $branch + "`"), inline: true },
                  { name: "Author", value: ("`" + $author + "`"), inline: false }
                ]
              }]
            }')

          echo "json<<EOF" >> $GITHUB_OUTPUT
          echo "$PAYLOAD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d '${{ steps.payload.outputs.json }}' \
            "$DISCORD_WEBHOOK_URL"
