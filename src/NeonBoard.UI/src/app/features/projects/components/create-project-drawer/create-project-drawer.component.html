<app-drawer [open]="open()" (close)="onClose()">
  <div class="space-y-6">
    <div>
      <h2 class="text-lg font-semibold text-primary">Create Project</h2>
      <p class="text-sm text-muted mt-1">Add a new project to organize your tasks</p>
    </div>

    <!-- Error message -->
    <app-error-banner [message]="error()" />

    <div class="space-y-4">
      <div>
        <label class="block text-sm text-secondary mb-1.5">Project name</label>
        <app-input
          [formField]="projectForm.name"
          placeholder="Enter project name..."
        />
      </div>

      <div>
        <label class="block text-sm text-secondary mb-1.5">Description (optional)</label>
        <app-input
          element="textarea"
          [formField]="projectForm.description"
          placeholder="What is this project about?"
          [rows]="3"
        />
      </div>
    </div>

    <div class="flex gap-3 pt-4 border-t border-subtle">
      <app-button
        variant="primary"
        (click)="createProject()"
        [disabled]="isCreating() || projectForm().invalid()">
        {{ isCreating() ? 'Creating...' : 'Create Project' }}
      </app-button>
      <app-button
        variant="secondary"
        (click)="onClose()"
        [disabled]="isCreating()">
        Cancel
      </app-button>
    </div>
  </div>
</app-drawer>
