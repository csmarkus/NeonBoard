<div
  (click)="cardClick.emit()"
  class="bg-surface border border-subtle rounded-lg p-3 pt-1 hover:border-cyan-500/50 transition-colors cursor-pointer"
>
  <span class="text-xs text-muted font-mono font-bold">{{ card().displayId }}</span>
  <h3 class="text-sm text-primary mt-1">{{ card().title }}</h3>
  @if (cardLabels().length) {
    <div class="flex flex-wrap gap-1 mt-2">
      @for (label of cardLabels(); track label.id) {
        <span
          [class]="'inline-flex items-center px-1.5 py-0.5 text-xs font-medium rounded border ' + getLabelClasses(label.color)"
          [title]="label.name"
        >{{ label.name }}</span>
      }
    </div>
  }
  @if (card().description) {
    <div class="mt-2 flex items-center">
      <fa-icon [icon]="faAlignLeft" class="text-sm text-muted"></fa-icon>
    </div>
  }
</div>
