<div cdkDrag [cdkDragDisabled]="!canEdit()" class="flex flex-col w-72 shrink-0 max-h-[calc(100vh-12rem)]">
  <!-- Column drag placeholder -->
  <div *cdkDragPlaceholder class="w-72 h-full min-h-[200px] bg-accent/15 border-2 border-dashed border-accent/40 rounded-lg"></div>

  <!-- Column header (drag handle) -->
  <div cdkDragHandle class="flex items-center gap-2.5 mb-4 px-0.5 group relative">
    <div [class]="'w-2 h-2 rounded-full ' + accentClass()"></div>

    @if (editingName()) {
      <!-- Inline edit mode -->
      <input
        type="text"
        [(ngModel)]="editingValue"
        (keyup.enter)="saveName()"
        (keyup.escape)="cancelEdit()"
        (blur)="saveName()"
        class="flex-1 px-2 py-1 text-sm bg-surface text-primary border border-accent rounded focus:outline-none"
        autofocus
      />
    } @else {
      <h2 class="text-sm font-medium text-primary uppercase">{{ column().name }}</h2>
    }

    <span class="text-sm text-muted tabular-nums">{{ cards().length }}</span>

    @if (canEdit()) {
      <div class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity">
        <button
          #menuTrigger
          (click)="toggleMenu()"
          class="p-1 hover:bg-surface rounded transition-colors"
        >
          <fa-icon [icon]="faGripVertical" class="text-sm text-muted"></fa-icon>
        </button>
      </div>
    }

    <!-- Column menu dropdown -->
    @if (menuOpen()) {
      <div #menuDropdown class="absolute right-0 top-8 bg-surface border border-subtle rounded-lg shadow-lg py-1 z-10 min-w-[140px]">
        <button
          (click)="startEdit()"
          class="w-full px-3 py-2 text-left text-sm text-primary hover:bg-surface-elevated transition-colors"
        >
          Rename
        </button>
        <button
          (click)="deleteColumn()"
          class="w-full px-3 py-2 text-left text-sm text-red-400 hover:bg-red-500/10 transition-colors"
        >
          Delete
        </button>
      </div>
    }
  </div>

  <!-- Cards container (drop zone) -->
  <div
    cdkDropList
    [id]="column().id"
    [cdkDropListData]="cards()"
    [cdkDropListConnectedTo]="columnIds()"
    [cdkDropListDisabled]="!canEdit()"
    (cdkDropListDropped)="onCardDrop($event)"
    class="flex flex-col gap-2 rounded-lg transition-colors overflow-y-auto flex-1 min-h-24"
  >
    @for (card of cards(); track card.id) {
      <div cdkDrag [cdkDragData]="card" [cdkDragDisabled]="!canEdit()" (pointerdown)="onCardPointerdown($event)">
        <app-card [card]="card" (cardClick)="selectCard(card)"></app-card>
        <div *cdkDragPlaceholder class="card-drag-placeholder" [style.height.px]="draggedCardHeight()"></div>
      </div>
    }

    <!-- Inline add card form -->
    @if (addingCard() && canEdit()) {
      <div #addCardForm class="relative z-20 bg-surface border border-subtle rounded-lg overflow-hidden shrink-0">
        <textarea
          #addCardTextarea
          [(ngModel)]="newCardTitle"
          (keydown.enter)="$event.preventDefault(); saveCard()"
          (keyup.escape)="cancelAddCard()"
          (input)="autoResize($event)"
          placeholder="Card title..."
          rows="1"
          class="w-full px-3 pt-3 pb-2 text-sm bg-transparent text-primary placeholder:text-muted border-none focus:outline-none resize-none overflow-hidden"
        ></textarea>
        <div class="flex">
          <button
            (click)="saveCard()"
            [disabled]="!newCardTitle().trim()"
            class="flex-1 flex items-center justify-center py-1.5 bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
            title="Add card"
          >
            <fa-icon [icon]="faCheck" size="xs"></fa-icon>
          </button>
          <button
            (click)="cancelAddCard()"
            class="flex-1 flex items-center justify-center py-1.5 bg-red-500/10 text-red-400 hover:bg-red-500/20 transition-colors"
            title="Cancel"
          >
            <fa-icon [icon]="faXmark" size="xs"></fa-icon>
          </button>
        </div>
      </div>
    }
  </div>

  <!-- Add card button -->
  @if (canEdit()) {
    <button
      (click)="openAddCard()"
      class="mt-2 py-2 w-full text-sm text-muted rounded-lg hover:bg-surface hover:text-secondary transition-colors duration-150 shrink-0"
    >
      + Add card
    </button>
  }
</div>
