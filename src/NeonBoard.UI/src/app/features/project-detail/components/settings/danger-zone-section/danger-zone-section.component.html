<app-settings-section
  title="Danger zone"
  [description]="'Irreversible actions for this ' + entityName() + '.'"
  variant="danger">
  <div class="bg-surface border border-red-500/20 rounded-lg p-5">
    <div class="flex items-center justify-between">
      <div>
        <h3 class="text-sm font-medium text-primary">Delete this {{ entityName() }}</h3>
        <p class="text-xs text-muted mt-0.5">{{ deleteDescription() }}</p>
      </div>
      <app-button
        variant="danger"
        size="sm"
        [disabled]="isDeleting()"
        (click)="openDeleteModal()">
        Delete {{ entityName() }}
      </app-button>
    </div>
  </div>
</app-settings-section>
