<app-settings-section title="General" description="Manage your board settings.">
  <div class="space-y-4">
    <div>
      <label for="board-name" class="block text-sm font-medium text-primary mb-1.5">Board name</label>
      <app-input
        inputId="board-name"
        [value]="facade.boardName()"
        (valueChange)="onNameInput($event)"
        [maxlength]="100"
      />
      <span class="text-xs text-muted mt-1.5">{{ facade.boardName().length }} / 100</span>
    </div>

    <div>
      <label for="board-prefix" class="block text-sm font-medium text-primary mb-1.5">Board prefix</label>
      <app-input
        inputId="board-prefix"
        [value]="facade.boardPrefix()"
        (valueChange)="onPrefixChange($event)"
        [maxlength]="5"
        placeholder="e.g. DEV"
        extraClass="uppercase"
      />
      <span class="text-xs text-muted mt-1.5">2-5 uppercase letters. Used for card IDs (e.g. DEV-1, DEV-2).</span>
    </div>
  </div>
</app-settings-section>
