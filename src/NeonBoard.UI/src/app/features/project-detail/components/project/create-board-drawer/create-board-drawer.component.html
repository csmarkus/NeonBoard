<app-drawer [open]="open()" (close)="onClose()">
  <div class="space-y-6">
    <div>
      <h2 class="text-lg font-semibold text-primary">Create Board</h2>
      <p class="text-sm text-muted mt-1">Add a new board to organize your work</p>
    </div>

    <!-- Error message -->
    <app-error-banner [message]="error()" />

    <div class="space-y-4">
      <div>
        <label class="block text-sm text-secondary mb-1.5">Board name</label>
        <app-input
          [(value)]="newBoardName"
          placeholder="Enter board name..."
          (keyup.enter)="createBoard()"
        />
      </div>

      <div>
        <label class="block text-sm text-secondary mb-1.5">Prefix (optional)</label>
        <app-input
          [(value)]="newBoardPrefix"
          [maxlength]="5"
          (keyup.enter)="createBoard()"
          extraClass="uppercase"
        />
        <span class="text-xs text-muted mt-1">2-5 uppercase letters for card IDs. Auto-generated if left blank.</span>
      </div>
    </div>

    <div class="flex gap-3 pt-4 border-t border-subtle">
      <app-button
        variant="primary"
        (click)="createBoard()"
        [disabled]="isCreating() || !newBoardName().trim()">
        {{ isCreating() ? 'Creating...' : 'Create Board' }}
      </app-button>
      <app-button
        variant="secondary"
        (click)="onClose()"
        [disabled]="isCreating()">
        Cancel
      </app-button>
    </div>
  </div>
</app-drawer>
