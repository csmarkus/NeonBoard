@if (facade.isLoading()) {
  <div class="flex-1 flex items-center justify-center">
    <div class="text-center">
      <div class="inline-block w-8 h-8 border-4 border-accent/20 border-t-accent rounded-full animate-spin mb-4"></div>
      <p class="text-sm text-muted">Loading board settings...</p>
    </div>
  </div>
} @else {
  <app-page-header [breadcrumbs]="breadcrumbs()">
    @if (projectContext.canEdit()) {
      <app-button
        variant="primary"
        size="sm"
        [disabled]="!facade.hasChanges() || facade.isSaving() || !facade.boardName().trim()"
        (click)="saveChanges()">
        {{ facade.isSaving() ? 'Saving...' : 'Save changes' }}
      </app-button>
    }
  </app-page-header>

  <main class="flex-1 overflow-y-auto">
    <div class="max-w-4xl mx-auto py-8 px-6">
      <a
        [routerLink]="['/p', shortId(), 'b', slug()]"
        class="inline-flex items-center gap-1.5 text-sm text-muted hover:text-primary transition-colors">
        <fa-icon [icon]="faChevronLeft" class="text-sm"></fa-icon>
        Back to board
      </a>

      <h2 class="text-lg font-semibold text-primary mt-8 mb-12">Board settings</h2>

      <app-general-settings-section
        [projectId]="projectId()"
        [boardId]="boardId()" />

      <hr class="border-subtle my-12" />

      <app-label-management-section
        [projectId]="projectId()"
        [boardId]="boardId()" />

      <hr class="border-subtle my-12" />

      @if (projectContext.isOwner()) {
        <app-danger-zone-section
          entityName="board"
          deleteDescription="All columns and cards will be permanently removed."
          deleteMessage="Are you sure you want to delete this board? All columns and cards will be permanently removed. This action cannot be undone."
          [isDeleting]="isDeleting()"
          (delete)="onDeleteBoard()" />
      }
    </div>
  </main>
}
