@if (facade.isLoading()) {
  <div class="flex-1 flex items-center justify-center">
    <div class="text-center">
      <div class="inline-block w-8 h-8 border-4 border-accent/20 border-t-accent rounded-full animate-spin mb-4"></div>
      <p class="text-sm text-muted">Loading project settings...</p>
    </div>
  </div>
} @else {
  <app-page-header [breadcrumbs]="breadcrumbs()">
    @if (projectContext.isOwner()) {
      <app-button
        variant="primary"
        size="sm"
        [disabled]="!facade.hasChanges() || facade.isSaving() || !facade.projectName().trim()"
        (click)="saveChanges()">
        {{ facade.isSaving() ? 'Saving...' : 'Save changes' }}
      </app-button>
    }
  </app-page-header>

  <main class="flex-1 overflow-y-auto">
    <div class="max-w-4xl mx-auto py-8 px-6">
      <a
        [routerLink]="['/p', shortId()]"
        class="inline-flex items-center gap-1.5 text-sm text-muted hover:text-primary transition-colors">
        <fa-icon [icon]="faChevronLeft" class="text-sm"></fa-icon>
        Back to project
      </a>

      <h2 class="text-lg font-semibold text-primary mt-8 mb-12">Project settings</h2>

      <app-project-general-settings-section />

      <hr class="border-subtle my-12" />

      @if (projectId()) {
        <app-members-section
          [projectId]="projectId()"
          [currentUserRole]="currentUserRole()" />

        <hr class="border-subtle my-12" />
      }

      @if (projectContext.isOwner()) {
        <app-danger-zone-section
          entityName="project"
          deleteDescription="All boards, columns, and cards will be permanently removed."
          deleteMessage="Are you sure you want to delete this project? All boards, columns, and cards will be permanently removed. This action cannot be undone."
          [isDeleting]="isDeleting()"
          (delete)="onDeleteProject()" />
      }
    </div>
  </main>
}
