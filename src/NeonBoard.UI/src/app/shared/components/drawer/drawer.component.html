<!-- Backdrop -->
<div
  [class]="backdropClasses"
  (click)="close.emit()"
  aria-hidden="true"
></div>

<!-- Drawer panel -->
<div
  [class]="panelClasses"
  role="dialog"
  aria-modal="true"
  aria-labelledby="drawer-title"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="open()"
>
  <!-- Close button -->
  <button
    (click)="close.emit()"
    class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center text-muted hover:text-primary hover:bg-surface-elevated rounded-lg transition-colors"
    aria-label="Close"
  >
    <fa-icon [icon]="faTimes" aria-hidden="true"></fa-icon>
  </button>

  <!-- Content -->
  <div class="h-full overflow-y-auto p-6">
    <ng-content></ng-content>
  </div>
</div>
