<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label [attr.for]="inputId()" class="text-sm text-secondary">{{ label() }}</label>
  }
  @if (element() === 'textarea') {
    <textarea
      [id]="inputId()"
      [placeholder]="placeholder()"
      [class]="inputClasses()"
      [rows]="rows()"
      [attr.maxlength]="maxlength()"
      [disabled]="disabled()"
      [value]="value()"
      (input)="onInput($event)"
      (blur)="onBlur()"
    ></textarea>
  } @else {
    <input
      [id]="inputId()"
      [type]="type()"
      [placeholder]="placeholder()"
      [class]="inputClasses()"
      [attr.maxlength]="maxlength()"
      [disabled]="disabled()"
      [value]="value()"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
  }
  @if (error()) {
    <span class="text-xs text-danger">{{ error() }}</span>
  }
</div>
