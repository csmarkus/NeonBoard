@if (auth.user$ | async; as user) {
  <div class="relative">
    <button
      (click)="toggleUserMenu()"
      class="flex items-center gap-3 hover:opacity-80 transition-opacity"
    >
      @if (user.picture) {
        <img
          [src]="user.picture"
          [alt]="user.name || 'User'"
          class="w-8 h-8 rounded-full object-cover"
        />
      } @else {
        <div class="w-8 h-8 rounded-full bg-accent/20 flex items-center justify-center">
          <span class="text-sm text-accent font-medium">{{ getUserInitials(user.name) }}</span>
        </div>
      }
    </button>

    <!-- User menu dropdown -->
    @if (showUserMenu) {
      <!-- Backdrop to close menu when clicking outside -->
      <div class="fixed inset-0 z-40" (click)="showUserMenu = false"></div>
      <div class="absolute right-0 mt-2 w-56 bg-surface border border-subtle rounded-lg shadow-lg py-2 z-50">
        <div class="px-4 py-2 border-b border-subtle">
          <p class="text-sm font-medium text-primary">{{ user.name }}</p>
          <p class="text-xs text-muted mt-0.5">{{ user.email }}</p>
        </div>
        <button
          (click)="logout()"
          class="w-full px-4 py-2 text-left text-sm text-danger hover:bg-danger/10 transition-colors"
        >
          <span class="flex items-center gap-2">
            <fa-icon [icon]="faRightFromBracket" class="text-base"></fa-icon>
            Log out
          </span>
        </button>
      </div>
    }
  </div>
}
